name: godot-runtime-build
# Phase 1: build the pinned upstream Godot 4.7.2-stable editor (headless-capable) on a free runner.
# Upstream is fetched at build time, never vendored. Result is recorded in docs/STATUS.md by hand.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/godot-build.yml'
permissions:
  contents: write
jobs:
  linux-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Godot
        run: git clone --depth 1 --branch 4.7.2-stable https://github.com/godotengine/godot.git godot
      - name: Apply AK branding patch (name string only)
        working-directory: godot
        run: |
          sed -i 's/^name = "Godot Engine"/name = "AK Engine"/' version.py
          grep -n '^name' version.py
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential scons pkg-config libx11-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libglu-dev libasound2-dev libpulse-dev libudev-dev libxi-dev libxrandr-dev libwayland-dev xvfb x11-apps imagemagick mesa-utils libgl1-mesa-dri
      - uses: actions/cache@v4
        with:
          path: godot/.scons_cache
          key: scons-linux-editor-${{ github.run_id }}
          restore-keys: scons-linux-editor-
      - name: Build editor
        working-directory: godot
        env:
          SCONS_CACHE: .scons_cache
          SCONS_CACHE_LIMIT: 4096
        run: scons platform=linuxbsd target=editor debug_symbols=no module_raycast_enabled=no -j$(nproc)
      - name: Smoke test headless
        working-directory: godot
        run: |
          ls -la bin
          ./bin/godot.linuxbsd.editor.x86_64 --headless --version
          ./bin/godot.linuxbsd.editor.x86_64 --headless --quit
      - name: Render real screenshot of the smoke scene (software GL)
        run: |
          cd project
          xvfb-run -a -s "-screen 0 1280x720x24" ../godot/bin/godot.linuxbsd.editor.x86_64 --rendering-driver opengl3 --path . --script shot.gd 2>&1 | tee ../render.log
          ls -la ..
      - name: Launch real editor UI and capture a screenshot
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1600x900x24 &
          sleep 3
          ./godot/bin/godot.linuxbsd.editor.x86_64 --rendering-driver opengl3 --editor --path project --resolution 1600x900 > editor.log 2>&1 &
          sleep 60
          import -window root editor.png || true
          ls -la editor.png
          pkill -f godot.linuxbsd || true
      - name: Commit render evidence to repo
        run: |
          git config user.name "ak-engine-ci"
          git config user.email "ci@users.noreply.github.com"
          mkdir -p docs/evidence
          cp shot.png docs/evidence/shot-run${{ github.run_number }}.png
          cp render.log docs/evidence/render-run${{ github.run_number }}.log
          cp editor.png docs/evidence/editor-run${{ github.run_number }}.png || true
          cp editor.log docs/evidence/editor-run${{ github.run_number }}.log || true
          git add docs/evidence
          git commit -m "CI render evidence from run ${{ github.run_number }}"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ak-engine-linux-editor
          path: |
            godot/bin/godot.linuxbsd.editor.x86_64
            render.log
            shot.png
            editor.png
