name: godot-runtime-build
# Phase 1: build the pinned upstream Godot 4.7.2-stable editor (headless-capable) on a free runner.
# Upstream is fetched at build time, never vendored. Result is recorded in docs/STATUS.md by hand.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/godot-build.yml'
jobs:
  linux-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Godot
        run: git clone --depth 1 --branch 4.7.2-stable https://github.com/godotengine/godot.git godot
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential scons pkg-config libx11-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libglu-dev libasound2-dev libpulse-dev libudev-dev libxi-dev libxrandr-dev libwayland-dev
      - uses: actions/cache@v4
        with:
          path: godot/.scons_cache
          key: scons-linux-editor-${{ github.run_id }}
          restore-keys: scons-linux-editor-
      - name: Build editor
        working-directory: godot
        env:
          SCONS_CACHE: .scons_cache
          SCONS_CACHE_LIMIT: 4096
        run: scons platform=linuxbsd target=editor debug_symbols=no module_raycast_enabled=no -j$(nproc)
      - name: Smoke test headless
        working-directory: godot
        run: |
          ls -la bin
          ./bin/godot.linuxbsd.editor.x86_64 --headless --version
          ./bin/godot.linuxbsd.editor.x86_64 --headless --quit
