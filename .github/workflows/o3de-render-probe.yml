name: o3de-render-probe
# M3 of docs/O3DE-INTEGRATION.md: configure O3DE, then build only AzCore, Atom RHI and Atom RPI libraries. Logs timings and errors. Not the editor, no rendering.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Fetch pinned O3DE
        run: git clone --depth 1 --branch 2610.0 https://github.com/o3de/o3de.git o3de
      - uses: actions/cache@v4
        with:
          path: o3de/AutomatedTesting/Cache
          key: apcache-o3de-2610-v1
      - name: Patch Vulkan allocator callbacks (experiment)
        run: |
          grep -rn "VkSystemAllocator::Get" o3de/Gems/Atom/RHI/Vulkan | head -20 | tee patch.log
          python3 - <<'PY' | tee -a patch.log
          import re,glob
          n=0
          for p in glob.glob('o3de/Gems/Atom/RHI/Vulkan/**/*.cpp',recursive=True):
              t=open(p).read()
              t2=re.sub(r'(VkAllocationCallbacks\s*\*\s*VkSystemAllocator::Get\s*\(\s*\)\s*\{)',r'\1 return nullptr;',t)
              if t2!=t:
                  open(p,'w').write(t2); n+=1; print('patched',p)
          print('files patched',n)
          PY
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache imagemagick xvfb x11-utils ninja-build gdb xdotool clang libunwind-dev libwayland-dev wayland-protocols libegl1-mesa-dev libxcb-cursor-dev libxcb-shape0-dev libxcb-sync-dev libxcb-util-dev libxcb-xrm-dev libxkbfile-dev libxrender-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libxss-dev libssl-dev mesa-vulkan-drivers vulkan-tools libglu1-mesa-dev libxcb-xinerama0 libxcb-xinput0 libxcb-xinput-dev libxcb-xfixes0-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libcurl4-openssl-dev libnvidia-egl-wayland1 libxcb-xkb-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev libxcb-render-util0-dev libxcb-randr0-dev zlib1g-dev libpcre2-16-0
          cmake --version
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-o3de-${{ github.run_id }}
          restore-keys: |
            ccache-o3de-
      - name: Configure (log only)
        continue-on-error: true
        run: |
          START=$(date +%s)
          set +e
          cmake -S o3de -B build -G Ninja -DCMAKE_BUILD_TYPE=profile -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DLY_DISABLE_TEST_MODULES=ON -DLY_PROJECTS=AutomatedTesting > configure.full.log 2>&1
          RC=$?
          END=$(date +%s)
          {
          echo "O3DE_CONFIGURE_EXIT $RC"
          echo "SECONDS $((END-START))"
          echo "DISK_FREE_GB $(df -BG --output=avail / | tail -1 | tr -dc 0-9)"
          echo "BUILD_DIR_MB $(du -sm build 2>/dev/null | cut -f1)"
          echo "---- last 60 lines"
          tail -60 configure.full.log
          } > configure.log
          cat configure.log | head -12
      - name: Build libraries (log only)
        continue-on-error: true
        run: |
          set +e
          cd build
          ninja -t targets all | grep -E '^(AssetProcessorBatch|AutomatedTesting\.GameLauncher|AssetBuilder|ShaderManagementConsole)[:]' | cut -d: -f1 | sort -u > ../targets.txt; ninja -t targets all | grep -E '(Launcher|AssetProcessor|Assets)[A-Za-z_.]*: (phony|CXX_EXECUTABLE|CUSTOM_COMMAND)' | cut -d: -f1 | sort -u | head -80 > ../all_atom_targets.txt
          cat ../targets.txt
          START=$(date +%s)
          test -s ../targets.txt && timeout 19000 ninja -k 0 $(cat ../targets.txt) > ../build.full.log 2>&1
          RC=$?
          END=$(date +%s)
          {
          echo "O3DE_BUILD_EXIT $RC"
          echo "BUILD_SECONDS $((END-START))"
          echo "BUILD_DIR_MB $(du -sm . | cut -f1)"
          echo "---- building"; cat ../targets.txt; echo "---- all Atom_ targets"; cat ../all_atom_targets.txt
          echo "---- vulkaninfo"; vulkaninfo --summary 2>&1 | head -20
          echo "---- last 40 lines"; tail -40 ../build.full.log
          } > ../build.log
          cat ../build.log
      - name: Run AssetProcessor and launcher (log only)
        continue-on-error: true
        run: |
          set +e
          E=$PWD/o3de
          {
          echo "---- vulkan devices"; vulkaninfo --summary 2>&1 | grep -iE "deviceName|driverName|apiVersion|deviceType"
          cd build/bin/profile
          echo "---- AssetProcessorBatch"
          ( while true; do date +%T; df -h / | tail -1; free -m | sed -n 2p; sleep 120; done > $GITHUB_WORKSPACE/mon.log 2>&1 ) &
          for i in 1 2 3; do
            timeout 2700 ./AssetProcessorBatch --project-path=$E/AutomatedTesting --engine-path=$E --platforms=linux >> $GITHUB_WORKSPACE/ap.log 2>&1
            RC=$?; echo "AP pass $i exit $RC" >> $GITHUB_WORKSPACE/mon.log
            [ $RC -ne 124 ] && break
          done
          true
          echo "AP_EXIT $RC"; tail -25 $GITHUB_WORKSPACE/ap.log | cut -c1-240
          echo "---- GameLauncher"
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 3
          export DISPLAY=:99
          echo '---- level products'; find $E/AutomatedTesting/Cache -iname '*hermanubis*' 2>/dev/null | head -20; find $E/AutomatedTesting/Cache -iname '*.spawnable' 2>/dev/null | grep -i level | head -20; ls $E/AutomatedTesting/user/log 2>&1 | head
          N=0
          C=$E/AutomatedTesting/Cache/linux
          echo "---- graphics level products"; find $C/levels -iname '*.spawnable' | grep -i graphics | head -20
          echo "---- all spawnable count: $(find $C/levels -iname '*.spawnable' | wc -l)"
          echo "---- AP mentions"; grep -ih "levels/graphics/hermanubis" $GITHUB_WORKSPACE/ap.log | head -6 | cut -c1-200
          LVS=$(find $C/levels -iname '*.spawnable' ! -iname '*.network.spawnable' ! -iname 'player*' | grep -i graphics | sed 's#.*/levels/##; s#\.spawnable$##' | head -3)
          LVS="$LVS metadatatest/metadatatest"
          echo "candidates: $LVS"
          rm -f $E/AutomatedTesting/autoexec.cfg
          for LV in Levels/Graphics/hermanubis/hermanubis.spawnable Levels/Graphics/base_empty/base_empty.spawnable Levels/Graphics/hermanubis/hermanubis.spawnable; do
            N=$((N+1))
            timeout 420 ./AutomatedTesting.GameLauncher --project-path=$E/AutomatedTesting --engine-path=$E --rhi=vulkan -bg_ConnectToAssetProcessor=0 +r_width 640 +r_height 360 +r_fullscreen 0 +LoadLevel $LV > $GITHUB_WORKSPACE/launcher_$N.log 2>&1 &
            LP=$!
            sleep 250
            echo "attempt $N level $LV alive: $(kill -0 $LP 2>/dev/null && echo yes || echo no)"
            (sudo timeout 90 gdb -batch -p $(pgrep -f 'AutomatedTesting.GameLauncher --project' | tail -1) -ex 'thread apply all bt 14' > $GITHUB_WORKSPACE/stack_$N.log 2>&1 || true)
            import -window root $GITHUB_WORKSPACE/o3de_shot_$N.png; echo "shot $N bytes $(stat -c %s $GITHUB_WORKSPACE/o3de_shot_$N.png)"
            pkill -f AutomatedTesting.GameLauncher; sleep 5
            cp $E/AutomatedTesting/user/log/Game.log $GITHUB_WORKSPACE/game_$N.log 2>/dev/null
          done
          cp $GITHUB_WORKSPACE/o3de_shot_$N.png $GITHUB_WORKSPACE/o3de_shot.png
          cp $GITHUB_WORKSPACE/launcher_1.log $GITHUB_WORKSPACE/launcher.log
          sleep 20
          for n in 1 2 3; do echo "== game_$n"; grep -iE 'LevelSystem|level|spawnable' $GITHUB_WORKSPACE/game_$n.log 2>/dev/null | head -12 | cut -c1-250; done
          } > $GITHUB_WORKSPACE/run.log 2>&1
          cat $GITHUB_WORKSPACE/run.log
      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s configure.log
          gh release create o3de-render-probe-run${{ github.run_number }} configure.log build.log $(ls run.log o3de_shot.png o3de_shot_1.png o3de_shot_2.png o3de_shot_3.png o3de_shot_4.png stack_1.log stack_2.log stack_3.log o3de_console_1.png o3de_console_2.png ap.log game_1.log game_2.log game_3.log game_4.log launcher.log launcher_2.log launcher_3.log launcher_4.log mon.log patch.log) --repo "$GITHUB_REPOSITORY" --title "O3DE render probe run ${{ github.run_number }}" --notes "CI: O3DE 2610.0 configure plus AzCore, Atom RHI, Atom RPI library build attempt. Log only. Commit $GITHUB_SHA." --prerelease
