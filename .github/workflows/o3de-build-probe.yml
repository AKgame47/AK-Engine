name: o3de-build-probe
# M3 of docs/O3DE-INTEGRATION.md: configure O3DE, then build only AzCore, Atom RHI and Atom RPI libraries. Logs timings and errors. Not the editor, no rendering.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - name: Fetch pinned O3DE
        run: git clone --depth 1 --branch 2610.0 https://github.com/o3de/o3de.git o3de
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libunwind-dev libwayland-dev wayland-protocols libegl1-mesa-dev libxcb-cursor-dev libxcb-shape0-dev libxcb-sync-dev libxcb-util-dev libxcb-xrm-dev libxkbfile-dev libxrender-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libxss-dev libssl-dev libglu1-mesa-dev libxcb-xinerama0 libxcb-xinput0 libxcb-xinput-dev libxcb-xfixes0-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libcurl4-openssl-dev libnvidia-egl-wayland1 libxcb-xkb-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev libxcb-render-util0-dev libxcb-randr0-dev zlib1g-dev libpcre2-16-0
          cmake --version
      - name: Configure (log only)
        continue-on-error: true
        run: |
          START=$(date +%s)
          set +e
          cmake -S o3de -B build -G Ninja -DCMAKE_BUILD_TYPE=profile -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DLY_DISABLE_TEST_MODULES=ON > configure.full.log 2>&1
          RC=$?
          END=$(date +%s)
          {
          echo "O3DE_CONFIGURE_EXIT $RC"
          echo "SECONDS $((END-START))"
          echo "DISK_FREE_GB $(df -BG --output=avail / | tail -1 | tr -dc 0-9)"
          echo "BUILD_DIR_MB $(du -sm build 2>/dev/null | cut -f1)"
          echo "---- last 60 lines"
          tail -60 configure.full.log
          } > configure.log
          cat configure.log | head -12
      - name: Build libraries (log only)
        continue-on-error: true
        run: |
          set +e
          cd build
          ninja -t targets all | grep -E '^Atom_[A-Za-z_.]*: (phony|CXX_SHARED|CXX_STATIC)' | cut -d: -f1 | sort -u > ../all_atom_targets.txt; grep -E '^Atom_RHI\.(Null|Vulkan)\.Private$|^Atom_Feature_Common(\.Static)?$' ../all_atom_targets.txt > ../targets.txt
          cat ../targets.txt
          START=$(date +%s)
          test -s ../targets.txt && timeout 9000 ninja -k 0 $(cat ../targets.txt) > ../build.full.log 2>&1
          RC=$?
          END=$(date +%s)
          {
          echo "O3DE_BUILD_EXIT $RC"
          echo "BUILD_SECONDS $((END-START))"
          echo "BUILD_DIR_MB $(du -sm . | cut -f1)"
          echo "---- building"; cat ../targets.txt; echo "---- all Atom_ targets"; cat ../all_atom_targets.txt
          echo "---- last 40 lines"; tail -40 ../build.full.log
          } > ../build.log
          cat ../build.log
      - name: Publish result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s configure.log
          gh release create o3de-build-probe-run${{ github.run_number }} configure.log build.log --repo "$GITHUB_REPOSITORY" --title "O3DE build probe run ${{ github.run_number }}" --notes "CI: O3DE 2610.0 configure plus AzCore, Atom RHI, Atom RPI library build attempt. Log only. Commit $GITHUB_SHA." --prerelease
