name: car-build
# Builds the AK editor (cached) and runs tools/car-build/build_car.gd: first in-engine asset, a low-poly car, exported to glTF and rendered.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Godot
        run: git clone --depth 1 --branch 4.7.2-stable https://github.com/godotengine/godot.git godot
      - name: AK name patch
        working-directory: godot
        run: sed -i 's/^name = "Godot Engine"/name = "AK Engine"/' version.py
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential scons pkg-config libx11-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libglu-dev libasound2-dev libpulse-dev libudev-dev libxi-dev libxrandr-dev libwayland-dev xvfb libgl1-mesa-dri imagemagick
      - uses: actions/cache@v4
        with:
          path: godot/.scons_cache
          key: scons-akeditor-${{ github.run_id }}
          restore-keys: |
            scons-akeditor-
            scons-export-
      - name: Build editor
        working-directory: godot
        env:
          SCONS_CACHE: .scons_cache
          SCONS_CACHE_LIMIT: 6144
        run: scons platform=linuxbsd target=editor debug_symbols=no module_raycast_enabled=no -j$(nproc)
      - name: Build the car with engine mesh tools
        run: |
          mkdir -p cb
          cp tools/car-build/build_car.gd cb/build_car.gd
          printf 'config_version=5\n\n[application]\nconfig/name="car-build"\n\n[display]\nwindow/size/viewport_width=960\nwindow/size/viewport_height=540\n\n[rendering]\nrenderer/rendering_method="gl_compatibility"\n' > cb/project.godot
          ED=$PWD/godot/bin/godot.linuxbsd.editor.x86_64
          xvfb-run -a -s "-screen 0 1280x720x24" $ED --headless --path cb --import 2>&1 | tail -3
          xvfb-run -a -s "-screen 0 1280x720x24" $ED --path cb --script res://build_car.gd 2>&1 | tee car.log
          cp cb/ak_car.glb cb/car.png cb/car_side.png cb/car_rear.png . || true
          ls -la ak_car.glb car.png car_side.png car_rear.png
          if grep -q "CHECK .* FAIL" car.log; then echo "a check failed"; exit 1; fi
          grep -q "CAR_BUILD DONE" car.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: car-build
          path: |
            car.log
            ak_car.glb
            car.png
            car_side.png
            car_rear.png
      - name: Publish result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create car-build-run${{ github.run_number }} car.log ak_car.glb car.png car_side.png car_rear.png --repo "$GITHUB_REPOSITORY" --title "Car build run ${{ github.run_number }}" --notes "CI: a low-poly car built with engine mesh APIs (SurfaceTool), exported to glTF, re-imported and rendered. Stylized, not hyperreal. Built from $GITHUB_SHA." --prerelease
