name: web-test
# Downloads the published web demo, serves it over http, opens it in headless Chromium (software WebGL) and captures a screenshot plus the browser console.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag with ak-demo-web.zip
        default: web-demo-run1
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download web build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ github.event.inputs.tag }}" --repo "$GITHUB_REPOSITORY" --pattern ak-demo-web.zip
          mkdir site && unzip -q ak-demo-web.zip -d site
          ls site
      - name: Browser test
        run: |
          pip install playwright
          playwright install --with-deps chromium
          cd site && python3 -m http.server 8080 > ../server.log 2>&1 &
          sleep 2
          cat > t.py <<'PY'
          from playwright.sync_api import sync_playwright
          logs=[]
          with sync_playwright() as p:
              b=p.chromium.launch(args=["--use-gl=angle","--use-angle=swiftshader","--enable-unsafe-swiftshader","--ignore-gpu-blocklist"])
              pg=b.new_page(viewport={"width":1152,"height":648})
              pg.on("console",lambda m:logs.append(m.type+": "+m.text))
              pg.on("pageerror",lambda e:logs.append("pageerror: "+str(e)))
              pg.goto("http://localhost:8080/index.html")
              pg.wait_for_timeout(5000)
              pg.screenshot(path="web-early.png")
              pg.wait_for_timeout(25000)
              pg.screenshot(path="web-shot.png")
              b.close()
          open("browser-console.log","w").write("\n".join(logs))
          PY
          sed -i 's/^          //' t.py
          python3 t.py
          cat browser-console.log | head -40
          ls -la *.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-test
          path: |
            web-early.png
            web-shot.png
            browser-console.log
      - name: Publish capture
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create web-test-run${{ github.run_number }} $(ls web-early.png web-shot.png browser-console.log 2>/dev/null) --repo "$GITHUB_REPOSITORY" --title "Web test run ${{ github.run_number }}" --notes "Headless Chromium (software WebGL) loading ${{ github.event.inputs.tag }}." --prerelease || true
